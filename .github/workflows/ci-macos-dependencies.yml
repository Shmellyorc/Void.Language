name: D1 dependencies / macOS ARM64
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA containing the reviewed D1 sources and this workflow
        type: string
        required: true
permissions:
  contents: read
jobs:
  qualify:
    name: macOS ARM64 / ${{ matrix.configuration }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: bash
    env:
      D1_CONFIGURATION: ${{ matrix.configuration }}
      D1_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      # Keep D1 fixed. D2 will use a separate explicit selector and target list.
      D1_TESTS: project_manifest_header|project_manifest|project_dependencies
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify reviewed source and native runner, select Apple SDK
        run: |
          work="$(cd "$RUNNER_TEMP" && pwd -P)/void-d1"
          mkdir -p "$work/logs" "$work/tmp"
          printf 'D1_WORK=%s\nTMPDIR=%s/tmp\n' "$work" "$work" >> "$GITHUB_ENV"
          {
            printf 'Commit %s / ref %s / %s\n' "$GITHUB_SHA" "$GITHUB_REF" "$D1_CONFIGURATION"
            if ! [[ "$D1_REVIEWED_SHA" =~ ^[0-9a-f]{40}$ &&
                    "$D1_REVIEWED_SHA" = "$GITHUB_SHA" &&
                    "$D1_REVIEWED_SHA" = "$(git rev-parse HEAD)" ]]; then
              echo 'The selected ref and checkout must both match the full reviewed D1 commit SHA.'
              exit 1
            fi
            sw_vers
            uname -a
            df -h "$GITHUB_WORKSPACE" "$work"
            sysctl -n hw.memsize
            test "$RUNNER_ENVIRONMENT" = github-hosted
            test "$RUNNER_ARCH" = ARM64
            test "$(uname -m)" = arm64
            if ! test -d "$DEVELOPER_DIR"; then
              printf 'Required Xcode 26.3 installation is missing at %s\n' "$DEVELOPER_DIR" >&2
              exit 1
            fi
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-path
            xcrun --find ld
            cmake --version
            ninja --version
          } 2>&1 | tee "$work/logs/runner-sdk.log"
      - name: Bootstrap and verify LLVM Clang LLD 23.1.4
        run: python -B tools/ci/llvm_sdk.py 2>&1 | tee "$D1_WORK/logs/llvm-bootstrap.log"
      - name: Bootstrap pinned HTTP provider libraries
        run: |
          df -h "$GITHUB_WORKSPACE" "$TMPDIR"
          python -B tools/setup_http_deps.py --profile "$D1_CONFIGURATION" --jobs 2 --macos-install-only \
            2>&1 | tee "$D1_WORK/logs/http-bootstrap.log"
      - name: Bootstrap host providers and verify both dependency closures
        run: |
          python -B tools/ci/voidup_bootstrap.py bootstrap --configuration "$D1_CONFIGURATION" \
            --evidence "$D1_WORK/host" 2>&1 | tee "$D1_WORK/logs/host-bootstrap.log"
      - name: Configure native compiler with D1 test registrations
        run: |
          df -h "$GITHUB_WORKSPACE" "$TMPDIR"
          cmake -S . -B "$D1_WORK/build" -G Ninja \
            -DCMAKE_BUILD_TYPE="$D1_CONFIGURATION" -DBUILD_TESTING=ON \
            -DVOID_SANITIZERS=OFF -DVOID_LLVM_RESEARCH=OFF \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DLLVM_DIR="$LLVM_DIR" -DVOID_CLANG="$VOID_CLANG" -DVOID_LINKER="$VOID_LINKER" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            2>&1 | tee "$D1_WORK/logs/configure.log"
      - name: Build only compiler and D1 test binaries
        run: |
          cmake --build "$D1_WORK/build" --parallel 2 \
            --target voidc void_project_header void_project_manifest \
            2>&1 | tee "$D1_WORK/logs/compiler-build.log"
      - name: Smoke test native project check, JIT and AOT
        env:
          VOID_STDLIB_ROOT: ${{ github.workspace }}/stdlib
        run: |
          {
            work=$(cd "$D1_WORK" && pwd -P)
            compiler="$work/build/voidc"
            "$compiler" --version
            test "$(xcrun lipo -archs "$compiler")" = arm64
            "$compiler" new "$work/smoke"
            cat > "$work/smoke/src/app.void" <<'VOID'
          use console

          func main() -> i32:
              print("D1 ARM64 smoke")
              return 0
          VOID
            "$compiler" check --project "$work/smoke"
            jit_output=$("$compiler" run --project "$work/smoke" --no-cache)
            test "$jit_output" = 'D1 ARM64 smoke'
            "$compiler" build --project "$work/smoke" -o "$work/smoke-native"
            test "$(xcrun lipo -archs "$work/smoke-native")" = arm64
            aot_output=$("$work/smoke-native")
            test "$aot_output" = 'D1 ARM64 smoke'
          } 2>&1 | tee "$D1_WORK/logs/native-smoke.log"
      - name: Run the exact D1 CTest selection
        run: |
          selector="^($D1_TESTS)$"
          ctest --test-dir "$D1_WORK/build" -R "$selector" --show-only=json-v1 > "$D1_WORK/selection.json"
          python -B - "$D1_WORK/selection.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          expected = sorted(os.environ["D1_TESTS"].split("|"))
          tests = json.loads(Path(sys.argv[1]).read_text())["tests"]
          selected = sorted(test["name"] for test in tests)
          if selected != expected:
              raise SystemExit(f"Expected {expected}, selected {selected}")
          PY
          ctest --test-dir "$D1_WORK/build" -R "$selector" --no-tests=error \
            --verbose --output-on-failure 2>&1 | tee "$D1_WORK/logs/ctest.log"
      - name: Collect bounded failure diagnostics
        if: failure()
        run: |
          export D1_WORK="${D1_WORK:-$RUNNER_TEMP/void-d1}"
          mkdir -p "$D1_WORK/failure"
          { df -h "$GITHUB_WORKSPACE" "$D1_WORK"; sysctl -n hw.memsize; } \
            > "$D1_WORK/failure/runner-resources.txt" 2>&1
          python3 -B - <<'PY'
          import os
          from pathlib import Path

          work = Path(os.environ["D1_WORK"])
          profile = os.environ["D1_CONFIGURATION"]
          logs = list((work / "logs").glob("*.log"))
          logs += [work / path for path in (
              "selection.json",
              "build/Testing/Temporary/LastTest.log",
              "build/CMakeFiles/CMakeConfigureLog.yaml",
              "host/build-host-providers.log",
              "host/verify-dependencies.log",
          )]
          roots = (
              (Path("docs/net/http/evidence"), f"dependencies-macos-aws-lc-5.12.0-arm64-{profile}-*"),
              (work / "host/provider-builds", f"dependencies-macos-arm64-{profile}-*"),
          )
          for parent, pattern in roots:
              receipts = sorted(parent.glob(pattern))
              if receipts:
                  files = [path for path in receipts[-1].iterdir()
                           if path.suffix in (".log", ".stdout", ".stderr", ".json")
                           and path.is_file() and path.stat().st_size]
                  logs.extend(sorted(files, key=lambda path: path.stat().st_mtime_ns)[-4:])
          for number, path in enumerate(logs):
              if path.is_file():
                  with path.open("rb") as stream:
                      stream.seek(max(0, path.stat().st_size - 32 * 1024))
                      tail = stream.read()
                  (work / "failure" / f"{number:02d}-{path.name}").write_bytes(tail)
          PY
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-d1-${{ matrix.configuration }}-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/void-d1/failure
          if-no-files-found: warn
          retention-days: 7
