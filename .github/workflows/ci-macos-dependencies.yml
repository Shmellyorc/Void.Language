name: D1 dependencies / macOS ARM64
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA containing the reviewed D1 sources and this workflow
        type: string
        required: true
permissions:
  contents: read
jobs:
  qualify:
    uses: ./.github/workflows/ci-macos-package-qualification.yml
    with:
      reviewed_sha: ${{ inputs.reviewed_sha }}
      slice: d1
      test_names: project_manifest_header|project_manifest|project_dependencies
      build_targets: voidc void_project_header void_project_manifest
