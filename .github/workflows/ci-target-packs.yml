name: Publish with target packs
on:
  push:
    branches: [codex/milestone-4-cross-platform-publishing]
  workflow_dispatch:
    inputs:
      scope:
        description: Target-pack qualification scope
        type: choice
        default: foundation
        options: [foundation, acquisition, platform-probes, all]
concurrency:
  group: target-packs-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-linux:
    if: inputs.scope != 'platform-probes'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.scope == 'acquisition'
          && '[{"runner":"ubuntu-24.04-arm","job":"runtime","target":"linux-arm64","arch":"arm64"}]'
          || '[{"runner":"ubuntu-24.04","job":"runtime","target":"linux-x64","arch":"x64"},{"runner":"ubuntu-24.04-arm","job":"runtime","target":"linux-arm64","arch":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    env: &build-env
      PYTHONUTF8: '1'
      EXPERIMENT_CONFIGURATION: Release
    steps: &build-steps
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ (runner.os == 'Linux' || (runner.os == 'Windows' && runner.arch == 'ARM64')) && '3.14' || '3.12' }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Select isolated build and linker cache locations
        shell: bash
        run: |
          echo "EXPERIMENT_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          echo "THINLTO_CACHE_DIR=$RUNNER_TEMP/void-thinlto" >> "$GITHUB_ENV"
      - name: Install Linux development tools and Ubuntu link inputs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libffi-dev libedit-dev libxml2-dev libzstd-dev zlib1g-dev libtinfo-dev libc6-dev gcc-13 g++-13 libidn2-0 libunistring5
          python tools/ci/linux_disk.py prepare
      - name: Select the native Visual Studio SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v5
        with:
          path: .toolchains/llvm-23.1.4
          key: llvm-sdk-23.1.4-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Verify pinned compiler SDK
        run: python tools/ci/llvm_sdk.py
      - name: Identify pinned dependency closure
        id: http
        run: python tools/ci/http_bootstrap.py identity
      - uses: actions/cache@v5
        with:
          path: .toolchains/http/downloads
          key: ${{ steps.http.outputs.sources-key }}
      - uses: actions/cache@v5
        id: http-deps
        with:
          path: ${{ steps.http.outputs.prefix }}
          key: ${{ steps.http.outputs.deps-key }}
      - uses: actions/cache@v5
        with:
          path: |
            .toolchains/http/test-python
            .toolchains/http/test-certificates
            .toolchains/http/test-certificates-tools
          key: ${{ steps.http.outputs.fixtures-key }}
      - name: Verify or build pinned HTTP closure
        env:
          HTTP_DEPS_CACHE_HIT: ${{ steps.http-deps.outputs.cache-hit }}
        run: python tools/ci/http_bootstrap.py bootstrap
      - name: Build pinned Runtime host providers
        run: python tools/ci/voidup_bootstrap.py bootstrap
      - name: Configure the selective ThinLTO build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cache="$THINLTO_CACHE_DIR"
          mkdir "$cache"
          options=()
          if [ "$RUNNER_OS" = Linux ]; then
            options+=(-DVOID_LINUX_THINLTO=ON "-DCMAKE_EXE_LINKER_FLAGS=--ld-path=\"$VOID_LINKER\" -Wl,--thinlto-cache-dir=\"$cache\"")
          else
            options+=(-DCMAKE_OSX_ARCHITECTURES=arm64 "-DCMAKE_OSX_SYSROOT=$SDKROOT"
              "-DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-cache_path_lto,\"$cache\"")
          fi
          cmake -S . -B "$RUNNER_TEMP/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            "-DLLVM_DIR=$LLVM_DIR" "-DVOID_CLANG=$VOID_CLANG" "-DVOID_LINKER=$VOID_LINKER" "${options[@]}"
          cmake --build "$RUNNER_TEMP/build" --target voidc voidup --parallel 3
          test -n "$(find "$cache" -type f -size +0c | head -1)"
          find "$cache" -type f | wc -l
      - name: Configure and build Windows with the existing fast native configuration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B "$env:RUNNER_TEMP/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF `
            "-DLLVM_DIR=$env:LLVM_DIR" "-DVOID_CLANG=$env:VOID_CLANG"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/build" --target voidc voidup --parallel 3
      - uses: actions/download-artifact@v7
        if: matrix.job == 'acquisition'
        with:
          name: linux-arm64-runtime-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Qualify controlled signed target-pack release
        if: matrix.job == 'acquisition'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP"
          cmake --build "$work/build" --target voidls --parallel 3
          python -m pip install cryptography==49.0.0
          mkdir "$work/candidate"
          gh attestation verify "$work/runtime-linux-arm64.tar.gz" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci-target-packs.yml" --source-digest "$GITHUB_SHA"
          tar -C "$work/candidate" -xzf "$work/runtime-linux-arm64.tar.gz"
          grep -Fx "source $GITHUB_SHA" "$work/candidate/runtime/target-pack.txt"
          python tools/target_pack.py compose "$work/candidate" "$work/pack"
          python tests/voidup/target_packs.py "$work/build" "$(dirname "$VOID_CLANG")/.." "$work/pack" "$work/acquired" --scratch "$work"
          tar -C "$work/acquired" -czf "$work/acquired.tar.gz" .
      - uses: actions/upload-artifact@v6
        if: matrix.job == 'acquisition'
        with:
          name: signed-acquisition-distribution-${{ github.sha }}
          path: ${{ runner.temp }}/acquired.tar.gz
          if-no-files-found: error
      - name: Preserve the built compiler for cross-host publishing
        if: matrix.job == 'publisher' || matrix.target == 'linux-x64' || matrix.target == 'windows-x64'
        shell: bash
        run: |
          executable=voidc
          work="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            executable=voidc.exe
            work="$(cygpath -u "$work")"
          fi
          tar -C "$work/build" -czf "$work/compiler.tar.gz" "$executable"
      - uses: actions/upload-artifact@v6
        if: matrix.job == 'publisher' || matrix.target == 'linux-x64' || matrix.target == 'windows-x64'
        with:
          name: compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/compiler.tar.gz
          if-no-files-found: error
      - name: Qualify the local MSVC pack on the destination runner
        if: matrix.job == 'local-msvc'
        env:
          VOID_PACK_ID: custom-ci-${{ matrix.target }}
        shell: pwsh
        run: |
          python tools/target_pack.py "$env:RUNNER_TEMP/build" "$env:RUNNER_TEMP/pack" --id "$env:VOID_PACK_ID" --local-msvc-inputs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/project/target_packs.py produce "$env:RUNNER_TEMP/build/voidc.exe" "$env:RUNNER_TEMP/pack" "$env:RUNNER_TEMP/distributions"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/project/target_packs.py consume "$env:RUNNER_TEMP/distributions" --compiler "$env:RUNNER_TEMP/build/voidc.exe"
      - name: Verify native macOS publishing and application bundle
        if: matrix.job == 'publisher'
        run: python tests/project/native_publication.py "$RUNNER_TEMP/build/voidc" "$(dirname "$VOID_CLANG")"
      - name: Generate Runtime candidate and authenticated Ubuntu input references
        if: matrix.job == 'runtime'
        env:
          VOID_TARGET: ${{ matrix.target }}
        run: |
          python tools/target_pack.py "$RUNNER_TEMP/build" "$RUNNER_TEMP/candidate" --id "custom-ci-$VOID_TARGET" --cc gcc-13 --ubuntu-inputs
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP/candidate" -cf - . | gzip -n > "$RUNNER_TEMP/runtime-$VOID_TARGET.tar.gz"
      - uses: actions/attest@v4
        if: matrix.job == 'runtime'
        with:
          subject-path: ${{ runner.temp }}/runtime-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v6
        if: matrix.job == 'runtime'
        with:
          name: ${{ matrix.target }}-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: target-pack-build-evidence-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
  build-macos:
    if: inputs.scope != 'platform-probes' && inputs.scope != 'acquisition'
    strategy:
      matrix:
        include:
          - {runner: macos-26, job: publisher, target: macos-arm64, arch: arm64}
    runs-on: ${{ matrix.runner }}
    env: *build-env
    steps: *build-steps
  build-windows:
    if: inputs.scope != 'platform-probes' && inputs.scope != 'acquisition'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, job: local-msvc, target: windows-x64, arch: x64}
          - {runner: windows-11-arm, job: local-msvc, target: windows-arm64, arch: arm64}
    runs-on: ${{ matrix.runner }}
    env: *build-env
    steps: *build-steps
  publish-from-linux:
    needs: build-linux
    if: inputs.scope != 'acquisition'
    runs-on: ubuntu-24.04
    env:
      TARGETS: linux-arm64
    steps: &publish-steps
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/cache/restore@v5
        with:
          path: .toolchains/llvm-23.1.4
          key: llvm-sdk-23.1.4-${{ runner.os }}-${{ runner.arch }}-v1
      - run: python tools/ci/llvm_sdk.py
      - uses: actions/download-artifact@v7
        with:
          pattern: linux-*-runtime-${{ github.sha }}
          path: ${{ runner.temp }}
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Verify Runtime provenance and publish for Linux
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          work="$RUNNER_TEMP"
          executable=voidc
          export VOID_STDLIB_ROOT="$GITHUB_WORKSPACE/stdlib"
          if [ "$RUNNER_OS" = Windows ]; then
            work="$(cygpath -u "$work")"
            executable=voidc.exe
            VOID_STDLIB_ROOT="$(cygpath -m "$VOID_STDLIB_ROOT")"
          fi
          mkdir "$work/compiler" "$work/distributions"
          tar -C "$work/compiler" -xzf "$work/compiler.tar.gz"
          printf 'VOID native 23.1.4 v2\n%s\n' "$VOID_CLANG" > "$work/compiler/void-native.txt"
          for target in $TARGETS; do
            candidate="$work/candidate-$target"
            mkdir "$candidate"
            archive="$work/runtime-$target.tar.gz"
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci-target-packs.yml" --source-digest "$GITHUB_SHA"
            tar -C "$candidate" -xzf "$archive"
            grep -Fx "source $GITHUB_SHA" "$candidate/runtime/target-pack.txt"
            python tools/target_pack.py compose "$candidate" "$work/pack-$target"
            python tests/project/target_packs.py produce "$work/compiler/$executable" \
              "$work/pack-$target" "$work/distributions/$target"
          done
          python tests/project/target_packs.py archive "$work/distributions" "$work/distributions.tar.gz"
      - uses: actions/upload-artifact@v6
        with:
          name: distributions-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/distributions.tar.gz
          if-no-files-found: error
  publish-from-macos:
    needs: [build-linux, build-macos]
    runs-on: macos-26
    env:
      TARGETS: linux-x64 linux-arm64
    steps: *publish-steps
  publish-from-windows:
    needs: [build-linux, build-windows]
    if: ${{ !cancelled() && inputs.scope != 'acquisition' && needs.build-linux.result == 'success' }}
    runs-on: windows-2022
    env:
      TARGETS: linux-x64 linux-arm64
    steps: *publish-steps
  run-from-linux:
    needs: publish-from-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04-arm, target: linux-arm64}
    runs-on: ${{ matrix.runner }}
    env:
      PRODUCER: Linux-X64
    steps: &run-steps
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: distributions-${{ env.PRODUCER }}-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Execute relocated distributions on the destination architecture
        run: |
          mkdir "$RUNNER_TEMP/distributions"
          tar -C "$RUNNER_TEMP/distributions" -xzf "$RUNNER_TEMP/distributions.tar.gz"
          python3 tests/project/target_packs.py consume "$RUNNER_TEMP/distributions/${{ matrix.target }}"
  run-from-macos:
    needs: publish-from-macos
    strategy: &linux-destinations
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64}
    runs-on: ${{ matrix.runner }}
    env:
      PRODUCER: macOS-ARM64
    steps: *run-steps
  run-from-windows:
    needs: publish-from-windows
    if: ${{ !cancelled() && needs.publish-from-windows.result == 'success' }}
    strategy: *linux-destinations
    runs-on: ${{ matrix.runner }}
    env:
      PRODUCER: Windows-X64
    steps: *run-steps
  acquire-official:
    if: inputs.scope == 'acquisition' || inputs.scope == 'all'
    needs: build-linux
    strategy:
      matrix:
        include:
          - {runner: ubuntu-24.04, job: acquisition, target: linux-arm64, arch: x64}
    runs-on: ${{ matrix.runner }}
    env: *build-env
    steps: *build-steps
  run-acquired:
    needs: acquire-official
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: signed-acquisition-distribution-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Run the official-pack publication on native Linux ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          mkdir "$RUNNER_TEMP/relocated"
          tar -C "$RUNNER_TEMP/relocated" -xzf "$RUNNER_TEMP/acquired.tar.gz"
          test "$(cd / && "$RUNNER_TEMP/relocated/app")" = 37
  probe-windows-link:
    if: inputs.scope == 'platform-probes' || inputs.scope == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify pinned LLVM-MinGW UCRT inputs and cross-link offline
        shell: bash
        run: |
          set -euo pipefail
          release=20261117
          archive="llvm-mingw-$release-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl --fail --location --output "$RUNNER_TEMP/$archive" "https://github.com/mstorsjo/llvm-mingw/releases/download/$release/$archive"
          echo "e7a15a49a2ea95e9f3d8a9d0cfabe5052a4b10fb4777cc54de5a8c27b64bb701  $RUNNER_TEMP/$archive" | sha256sum -c
          sdk="$RUNNER_TEMP/mingw"
          mkdir "$sdk" "$RUNNER_TEMP/windows-probes"
          tar -xf "$RUNNER_TEMP/$archive" -C "$sdk" --strip-components=1
          for arch in x86_64 aarch64; do
            image="$RUNNER_TEMP/windows-probes/$arch.exe"
            sudo unshare --net -- runuser -u "$USER" -- "$sdk/bin/$arch-w64-mingw32-clang++" \
              -std=c++20 -O2 -static -Iinclude tools/ci/probe_windows_ucrt.cpp src/runtime/application.cpp -o "$image"
            "$sdk/bin/llvm-readobj" --file-headers --coff-imports "$image" | tee "$RUNNER_TEMP/windows-probes/$arch.txt"
            if [ "$arch" = x86_64 ]; then machine=AMD64; else machine=ARM64; fi
            grep -q "Machine: IMAGE_FILE_MACHINE_$machine " "$RUNNER_TEMP/windows-probes/$arch.txt"
            grep -Ei 'Name: (ucrtbase|api-ms-win-crt-[^ ]+)\.dll' "$RUNNER_TEMP/windows-probes/$arch.txt"
            if grep -Ei 'Name: (msvcp|vcruntime|libc\+\+|libwinpthread)' "$RUNNER_TEMP/windows-probes/$arch.txt"; then exit 1; fi
          done
      - uses: actions/upload-artifact@v6
        with:
          name: windows-ucrt-link-probe-${{ github.sha }}
          path: ${{ runner.temp }}/windows-probes/
          if-no-files-found: error
  probe-windows-run:
    needs: probe-windows-link
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, cpu: x86_64}
          - {runner: windows-11-arm, cpu: aarch64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-ucrt-link-probe-${{ github.sha }}
          path: ${{ runner.temp }}/windows-probes
      - name: Execute on the destination architecture
        shell: pwsh
        run: |
          $cpu = '${{ matrix.cpu }}'
          $native = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if (($cpu -eq 'aarch64' -and $native -ne 'Arm64') -or ($cpu -eq 'x86_64' -and $native -ne 'X64')) { throw "Wrong native architecture: $native" }
          $output = & "$env:RUNNER_TEMP/windows-probes/$cpu.exe"
          if ($LASTEXITCODE -ne 0 -or $output -ne 'VOID UCRT ABI probe') { throw "Windows ABI probe failed: $output" }
          Write-Output "$native executed $output"
  probe-macos-link:
    if: inputs.scope == 'platform-probes' || inputs.scope == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/cache@v5
        with:
          path: .toolchains/llvm-23.1.4
          key: llvm-sdk-23.1.4-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Verify pinned compiler SDK
        run: python tools/ci/llvm_sdk.py
      - name: Link the independent adapter interface offline
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/macos-probes"
          sudo unshare --net -- runuser -u "$USER" -- tools/ci/probe_macos_offline.sh "$work" "$VOID_CLANG" "$(dirname "$VOID_CLANG")/ld64.lld"
          for arch in arm64 x86_64; do
            llvm-objdump --macho --private-headers --dylibs-used "$work/$arch/app" | tee "$work/$arch/link-audit.txt"
            grep -F '@rpath/libVoidProbe.dylib' "$work/$arch/link-audit.txt"
            grep -F '/usr/lib/libSystem.B.dylib' "$work/$arch/link-audit.txt"
          done
          tar -C "$work" -czf "$RUNNER_TEMP/macos-probes.tar.gz" arm64 x86_64
      - uses: actions/upload-artifact@v6
        with:
          name: macos-adapter-link-probe-${{ github.sha }}
          path: ${{ runner.temp }}/macos-probes.tar.gz
          if-no-files-found: error
  probe-macos-run:
    needs: probe-macos-link
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-26, cpu: arm64}
          - {runner: macos-26-intel, cpu: x86_64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: macos-adapter-link-probe-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Build the native adapter and run the cross-linked slice
        shell: bash
        run: |
          set -euo pipefail
          arch='${{ matrix.cpu }}'
          test "$(uname -m)" = "$arch"
          xcrun clang++ --version
          mkdir "$RUNNER_TEMP/macos-probes"
          tar -C "$RUNNER_TEMP/macos-probes" -xzf "$RUNNER_TEMP/macos-probes.tar.gz"
          slice="$RUNNER_TEMP/macos-probes/$arch"
          xcrun clang++ -std=c++20 -arch "$arch" -mmacosx-version-min=14.0 -fvisibility=hidden \
            -dynamiclib -Wl,-install_name,@rpath/libVoidProbe.dylib -Iinclude \
            tools/ci/probe_macos_adapter.cpp src/runtime/application.cpp -o "$slice/libVoidProbe.dylib"
          codesign --force --sign - "$slice/libVoidProbe.dylib"
          codesign --verify --strict "$slice/app"
          codesign --verify --strict "$slice/libVoidProbe.dylib"
          test "$(lipo -archs "$slice/app")" = "$arch"
          test "$(lipo -archs "$slice/libVoidProbe.dylib")" = "$arch"
          "$slice/app"
          echo "$arch executed the Linux-linked adapter probe"
