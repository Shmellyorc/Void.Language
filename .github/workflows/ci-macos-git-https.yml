name: D3 HTTPS Git acquisition / macOS ARM64
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA containing the reviewed D3 HTTPS sources and this workflow
        type: string
        required: true
permissions:
  contents: read
jobs:
  qualify:
    uses: ./.github/workflows/ci-macos-package-qualification.yml
    with:
      reviewed_sha: ${{ inputs.reviewed_sha }}
      slice: d3-https
      test_names: project_git_https
      build_targets: voidc
