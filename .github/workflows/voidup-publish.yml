name: VOIDUP publish reviewed signed release
on:
  workflow_dispatch:
    inputs:
      prepared_run_id:
        description: Successful approved native production-preparation run
        required: true
      version:
        description: Exact prepared stable version
        required: true
      public_config:
        description: Boss-approved public-only enrollment
        default: release/voidup/production-public-keys.json
      signed_catalog:
        description: Reviewed exact catalog with adjacent .sig in this checkout
        default: release/voidup/catalog.json
      publish:
        description: Boss-authorized production publication
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: voidup-production-publication
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PREPARED_RUN: ${{ inputs.prepared_run_id }}
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLIC_CONFIG: ${{ inputs.public_config }}
      SIGNED_CATALOG: ${{ inputs.signed_catalog }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.2
      - name: Admit the successful reviewed producer run and retain its source revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREPARED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARED_RUN" > "$RUNNER_TEMP/prepared-run.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'prepared-run.json').read_text())
          assert r['conclusion']=='success' and r['path']=='.github/workflows/voidup-release.yml'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PREPARED_SOURCE_SHA='+r['head_sha']+'\n')
          PY
      - name: Download public prepared payloads, never private signing keys
        run: gh run download "$PREPARED_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'voidup-production-*' --dir "$RUNNER_TEMP/prepared"
      - name: Assemble exact qualified assets and verify the offline threshold signatures
        run: |
          set -euo pipefail
          python tools/voidup_release.py assemble --inputs "$RUNNER_TEMP/prepared" --public-config "$PUBLIC_CONFIG" --source-sha "$PREPARED_SOURCE_SHA" --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/assets"
          python tools/voidup_release.py verify --public-config "$PUBLIC_CONFIG" --catalog "$SIGNED_CATALOG" --assets "$RUNNER_TEMP/assets" --version "$RELEASE_VERSION"
      - name: Verify the existing mutable channel and its authenticated freshness floor
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/voidup-stable" > "$RUNNER_TEMP/channel.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          channel=json.loads((Path(os.environ['RUNNER_TEMP'])/'channel.json').read_bytes())
          assert channel.get('immutable') is False, 'Create the mutable channel before enabling immutable version releases'
          assets={a['name'] for a in channel['assets']}
          pair={'catalog.json','catalog.json.sig'}
          assert not assets & pair or pair <= assets, 'Incomplete stable metadata pair requires operator recovery'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('VOIDUP_PREVIOUS_CATALOG='+str(bool(assets & pair)).lower()+'\n')
          PY
      - name: Reject catalog rollback, removed revocations and rewritten release identities
        if: env.VOIDUP_PREVIOUS_CATALOG == 'true'
        run: |
          set -euo pipefail
          gh release download voidup-stable --pattern 'catalog.json*' --dir "$RUNNER_TEMP/previous"
          python tools/voidup_release.py verify --public-config "$PUBLIC_CONFIG" --catalog "$SIGNED_CATALOG" --assets "$RUNNER_TEMP/assets" --version "$RELEASE_VERSION" --previous "$RUNNER_TEMP/previous/catalog.json"
      - name: Publish immutable version payloads before the stable catalog
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release tag already exists; refusing to replace immutable assets.' >&2
            exit 1
          fi
          gh release create "$tag" "$RUNNER_TEMP"/assets/* --target "$PREPARED_SOURCE_SHA" --draft --title "VOID $RELEASE_VERSION" --notes 'VOIDUP installers and complete authenticated VOID toolchains. See the reviewed installation and native qualification documentation.'
          gh release edit "$tag" --draft=false
      - name: Publish authenticated stable metadata last
        run: |
          set -euo pipefail
          cp "$SIGNED_CATALOG" "$RUNNER_TEMP/catalog.json"
          cp "$SIGNED_CATALOG.sig" "$RUNNER_TEMP/catalog.json.sig"
          gh release upload voidup-stable "$RUNNER_TEMP/catalog.json" "$RUNNER_TEMP/catalog.json.sig" --clobber
