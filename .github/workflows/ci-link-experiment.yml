# Qualification-branch dispatch bridge. The default-branch experiment is unchanged.
# This already registered workflow can dispatch a new reusable workflow without
# merging the new file into main. Never dispatch the original seven-job matrix.
name: Publisher Stage B macOS dispatch bridge
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed commit on the isolated Stage B qualification branch
        type: string
        required: true
permissions:
  contents: read
jobs:
  publisher:
    uses: ./.github/workflows/ci-publisher-stage-b-macos.yml
    with:
      reviewed_sha: ${{ inputs.reviewed_sha }}
