name: Project application and editor / macOS ARM64
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA containing the reviewed project and editor sources
        type: string
        required: true
permissions:
  contents: read
jobs:
  qualify:
    uses: ./.github/workflows/ci-macos-package-qualification.yml
    with:
      reviewed_sha: ${{ inputs.reviewed_sha }}
      slice: project-application
      test_names: project_application|project_application_process|os_packaging|project_selection|project_creation_process|project_profiles
      build_targets: voidc voidls void_project_application void_project_selection
      project_application: true
